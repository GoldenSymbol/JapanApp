<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14161A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MichiPlan" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@300;400;500;600;700&family=Zen+Old+Mincho:wght@400;600&display=swap" rel="stylesheet">
    <title>MichiPlan</title>
    <style>
      /* Portrait-only lock: iOS Safari (and most mobile browsers) don't honor the manifest's
         orientation field for web content, so this is the actual enforcement. Scoped to
         phone-sized screens via max-height so a landscape tablet or a resized desktop window
         — which have plenty of room for this narrow layout anyway — aren't blocked too. Inlined
         here (not in the app's own stylesheet) so it works even before the JS bundle loads. */
      .landscape-lock { display: none; }
      @media (orientation: landscape) and (max-height: 500px) {
        html, body { overflow: hidden; }
        .landscape-lock {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 99999;
          background: #14161A;
          color: #F6F4EF;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 24px;
          font: 500 15px/1.6 'Noto Sans Hebrew', sans-serif;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="landscape-lock">סובבו את המכשיר בחזרה למצב אנכי כדי להשתמש באפליקציה</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
